benchmark:
  duration: 0.0           # 0 = record until Ctrl+C
  robot_name: "husky"
  sample_rate: 50.0       # Hz

imu_dead_reckoning:
  gravity: 9.81
  initial_x: 0.0
  initial_y: 0.0
  initial_yaw: 0.0
  turnon_bias_accel: 0.02   # m/s^2, std dev of random bias sampled at startup
  turnon_bias_gyro: 0.01    # rad/s, std dev of random bias sampled at startup

# ──────────────────────────────────────────────────────────────────────
# IMU noise profiles
#
# The Gazebo IMU plugin noise (hector_gazebo_ros_imu) is selected at launch
# by a named profile defined in:
#   husky_description/config/imu_profiles.yaml
#
# Pick a profile via the imu_profile launch arg or the HUSKY_IMU_PROFILE env
# var (higher tier = better IMU = less noise):
#   roslaunch husky_gazebo empty_world.launch imu_profile:=lowend
#   HUSKY_IMU_PROFILE=highend ENABLE_EKF=true roslaunch husky_gazebo empty_world.launch
#
# Plugin noise per profile (mirrors imu_profiles.yaml). The turn-on bias
# columns are applied in this DR node (software-side) and must be set in the
# turnon_bias_* params above to match the chosen profile:
#
# ┌─────────┬─────────────┬─────────────┬────────────┬────────────┬───────────────┬───────────────┬──────────────┬─────────────┐
# │ Profile │ accel_noise │ accel_drift │ rate_noise │ rate_drift │ heading_noise │ heading_drift │ turnon_accel │ turnon_gyro │
# ├─────────┼─────────────┼─────────────┼────────────┼────────────┼───────────────┼───────────────┼──────────────┼─────────────┤
# │ highend │ 0.005       │ 0.005       │ 0.005      │ 0.005      │ 0.005         │ 0.005         │ 0.0          │ 0.0         │
# │ mid     │ 0.02        │ 0.01        │ 0.005      │ 0.002      │ 0.005         │ 0.005         │ 0.01         │ 0.005       │
# │ lowend  │ 0.08        │ 0.04        │ 0.03       │ 0.015      │ 0.02          │ 0.02          │ 0.03         │ 0.015       │
# └─────────┴─────────────┴─────────────┴────────────┴────────────┴───────────────┴───────────────┴──────────────┴─────────────┘
# ──────────────────────────────────────────────────────────────────────
